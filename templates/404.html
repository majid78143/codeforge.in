{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center text-center py-5">
  <div>
    <div style="font-size:6rem;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent">404</div>
    <h2 class="fw-800 mb-2">Page Not Found</h2>
    <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
    <div class="d-flex gap-3 justify-content-center">
      <a href="/" class="btn-primary-main btn">Go Home</a>
      <a href="/marketplace" class="btn-outline-main btn">Browse Marketplace</a>
    </div>
  </div>
</div>
{% endblock %}
