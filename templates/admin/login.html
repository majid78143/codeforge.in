<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | CodeForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body class="admin-body d-flex align-items-center justify-content-center min-vh-100" style="background:#0f172a">
<div style="width:100%;max-width:420px;padding:1.5rem">
  <div class="text-center mb-4">
    <div style="font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CodeForge</div>
    <div style="color:#475569;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-top:4px">ADMIN PANEL</div>
  </div>
  <div style="background:white;border-radius:16px;padding:2rem;box-shadow:0 25px 60px rgba(0,0,0,0.4)">
    <h4 class="fw-800 mb-1">Sign In</h4>
    <p class="text-muted mb-4" style="font-size:0.875rem">Enter your admin credentials</p>
    <div id="loginError" class="alert alert-danger d-none mb-3"></div>
    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="admin-form-label">Email Address</label>
        <input type="email" class="admin-input" name="email" placeholder="admin@example.com" required>
      </div>
      <div class="mb-4">
        <label class="admin-form-label">Password</label>
        <input type="password" class="admin-input" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-admin btn-admin-primary btn w-100 py-2 justify-content-center" style="font-size:0.9rem">Sign In to Admin Panel</button>
    </form>
  </div>
  <p class="text-center mt-3" style="font-size:0.8rem;color:#475569"><a href="/" style="color:#60a5fa">Return to Store</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
